apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.name }}-hubble-auth
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/
    trustForwardHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.name }}-dashboard-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Prefix: /{{ .Release.Namespace }}/hermes/{{ .Values.name }}/dashboard
      Accept-Encoding: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.name }}-dashboard-stripprefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /{{ .Release.Namespace }}/hermes/{{ .Values.name }}/dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-hermes-terminal
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: harmonyhpc
    traefik.ingress.kubernetes.io/router.priority: "50"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Values.name }}-hubble-auth@kubernetescrd
spec:
  ingressClassName: traefik-juno
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /{{ .Release.Namespace }}/hermes/{{ .Values.name }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.name }}-hermes
            port:
              number: 7681