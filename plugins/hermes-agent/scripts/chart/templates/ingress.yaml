apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-hermes-dashboard
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "90"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Values.name }}-hubble-auth@kubernetescrd,{{ .Release.Namespace }}-{{ .Values.name }}-dashboard-headers@kubernetescrd,{{ .Release.Namespace }}-{{ .Values.name }}-dashboard-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik-juno
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /{{ .Release.Namespace }}/hermes/{{ .Values.name }}/dashboard
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.name }}-hermes
            port:
              number: 9120
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-hermes-terminal
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "50"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Values.name }}-hubble-auth@kubernetescrd
spec:
  ingressClassName: traefik-juno
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /{{ .Release.Namespace }}/hermes/{{ .Values.name }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.name }}-hermes
            port:
              number: 7681