apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-hermes
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: harmonyhpc
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik-juno
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          # Two paths so Hubble lists both endpoints (dashboard + terminal). Both go to
          # the nginx sidecar, which routes /dashboard to the dashboard and the rest to wetty.
          - path: "/{{ .Release.Namespace }}/hermes/{{ .Values.name }}/dashboard"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-hermes
                port:
                  number: 8080
          - path: "/{{ .Release.Namespace }}/hermes/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-hermes
                port:
                  number: 8080
