apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-hermes
spec:
  selector:
    juno-innovations.com/workstation: "{{ .Values.name }}"
  ports:
    - port: 9120
      targetPort: 9120
      protocol: TCP
      name: http
    - port: 7681
      targetPort: 7681
      protocol: TCP
      name: http
    - port: {{ .Values.git_port }}
      targetPort: {{ .Values.git_port }}
      protocol: TCP
      name: git
