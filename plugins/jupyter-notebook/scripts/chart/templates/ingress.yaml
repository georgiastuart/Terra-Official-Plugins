apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: harmonyhpc
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik-juno
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/jupyter/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-jupyter-notebook
                port:
                  number: 8080