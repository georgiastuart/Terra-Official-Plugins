apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.name }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.host }}`) && PathPrefix(`/{{ .Release.Namespace }}/jupyter/{{ .Values.name }}`)
      kind: Rule
      services:
        - name: {{ .Values.name }}-jupyter-notebook
          port: 8080
  tls:
    certResolver: harmonyhpc