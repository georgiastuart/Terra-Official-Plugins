apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
spec:
  ingressClassName: traefik-juno
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/jupyter/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-jupyter-notebook
                port:
                  number: 8080