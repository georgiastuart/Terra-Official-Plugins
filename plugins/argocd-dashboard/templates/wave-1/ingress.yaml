apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-argocd-server-ingress"
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik-juno
  rules:
    - host: "{{ .Values.host }}"
      http:
        paths:
          - path: "{{ .Values.prefix }}"
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
